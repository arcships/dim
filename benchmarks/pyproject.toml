# Lint config for the eval harness. There is no Python package here — this file
# exists so that `ruff check benchmarks/` means the same thing on every machine,
# rather than depending on which directory the command was run from.

[tool.ruff]
# `tasks/` is the corpus, not our code. The task definitions are pinned upstream
# and trigger-policy.md forbids editing them, so a lint finding in there could
# only ever be resolved the wrong way — by changing a task and silently moving
# the measurement. `results/` is trial output.
extend-exclude = ["tasks", "results", "baselines", "ledger"]

[tool.ruff.lint]
# Spelled out rather than left to the default, so that a ruff upgrade cannot
# quietly widen or narrow what the gate checks. This is the set that would have
# caught the regression this gate exists for: `os.environ` with no `import os`
# is F821, found in 0.01s, by a suite that could not find it at all because no
# test covers the `--remote-judge` branch.
#
# Deliberately narrow. This is a correctness gate, not a style gate: a rule that
# reformats working code earns nothing here and costs a red pipeline on changes
# that are fine.
select = ["E4", "E7", "E9", "F"]
