name: Bug Report · 缺陷报告
description: Report a failure or regression in existing behavior. 报告现有功能的故障或回归。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/arcships/dim/issues?q=is%3Aissue) before filing. If one matches, add any new details there.

        提交前请[搜索已有 issue](https://github.com/arcships/dim/issues?q=is%3Aissue)。如果已有相同问题，请在原 issue 补充新信息。
  - type: dropdown
    id: surface
    attributes:
      label: Where did you see it? · 在哪里看到问题？
      options:
        - CLI / TUI
        - Web
        - Desktop · 桌面端
        - App Server / RPC
        - ACP
        - Install / Update · 安装或更新
        - Embedded runtime · 嵌入式运行时
        - Other / Not sure · 其他或不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dim version or commit · Dim 版本或提交
      description: |
        Paste the output of `dima --version` or `dimcode --version`. For a source build, provide the commit SHA.

        粘贴 `dima --version` 或 `dimcode --version` 的输出。从源码构建时请提供提交 SHA。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened? · 实际发生了什么？
      description: Describe what you observed and how it affected your task. 描述看到的现象及其对任务的影响。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? · 你预期发生什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps or conditions · 复现步骤或发生条件
      description: |
        Share the shortest command or prompt and any relevant starting state. For intermittent or one-off failures, describe when it happened and how often.

        提供最简命令或 prompt，以及相关的初始状态。对于偶发或仅出现一次的问题，请说明发生时的情况和频率。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics & context · 诊断信息和环境
      description: |
        Run `/report` in the TUI to generate a report for the current session. Review the generated report before sharing it on GitHub.
        If `/report` is unavailable and you installed the Rust alpha via npm, try updating with `npm install -g dimcode-alpha` and reproducing the issue.

        在 TUI 中运行 `/report` 可为当前会话生成报告。检查生成的报告后再分享到 GitHub。
        如果你通过 npm 安装了 Rust alpha 版，但没有 `/report` 命令，可以运行 `npm install -g dimcode-alpha` 更新后尝试复现。

        Include relevant details such as your OS or terminal, provider and model, permission mode, enabled plugins, hooks or MCP servers, or client and server versions.
        Share only relevant, redacted error messages, log or Timeline excerpts, or screenshots.

        按需补充操作系统或终端、模型提供方与模型名、权限模式、启用的插件、Hook 或 MCP 服务器，或客户端和服务端版本。
        只分享相关且已脱敏的错误信息、日志或 Timeline 片段及截图。
