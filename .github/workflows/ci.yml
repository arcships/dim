name: PR check
run-name: 'macOS verify A/B (${{ inputs.parallelism }})'
on:
  workflow_dispatch:
    inputs:
      parallelism:
        type: choice
        required: true
        options: [probe, '2', '3']
      sample_runner:
        type: choice
        default: dim-verify
        options: [dim-verify, dim-verify-ab-20261119-5, dim-verify-ab-20261119-6]
      load_runner:
        type: choice
        default: dim-verify-ab-20261119-5
        options: [dim-verify, dim-verify-ab-20261119-5, dim-verify-ab-20261119-6]
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  probe:
    if: inputs.parallelism == 'probe'
    strategy:
      fail-fast: false
      matrix:
        label: [dim-verify, dim-verify-ab-20261119-5, dim-verify-ab-20261119-6]
    runs-on: [self-hosted, macOS, ARM64, "${{ matrix.label }}"]
    timeout-minutes: 2
    steps:
      - name: Identify physical host and checkout
        shell: bash
        run: |
          set -euo pipefail
          uuid=$(ioreg -rd1 -c IOPlatformExpertDevice | awk -F'"' '/IOPlatformUUID/ {print $4}')
          test -n "$uuid"
          printf "Host key: "
          printf "%s:%s" "$GITHUB_SHA" "$uuid" | shasum -a 256 | cut -c1-16
          printf "Workspace key: "
          printf "%s" "$GITHUB_WORKSPACE" | shasum -a 256 | cut -c1-16
          printf "Runner UID: "
          id -u
  changes:
    # Pull requests run only the groups their paths need; scripts/ci-changes.mjs holds the rules.
    # Self-hosted runners keep state between jobs, so they run only code from branches of this
    # repository; fork pull requests skip every job and fail ci-ok. See docs/release/README.md.
    if: inputs.parallelism != 'probe'
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.groups.outputs.rust }}
      windows: ${{ steps.groups.outputs.windows }}
      xtask: ${{ steps.groups.outputs.xtask }}
      node: ${{ steps.groups.outputs.node }}
      eval: ${{ steps.groups.outputs.eval }}
      execution: ${{ steps.groups.outputs.execution }}
      web: ${{ steps.groups.outputs.web }}
      scripts: ${{ steps.groups.outputs.scripts }}
      dependencies: ${{ steps.groups.outputs.dependencies }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The merge commit and its base parent.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select check groups
        id: groups
        env:
          DIM_CI_PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-changes.mjs
      - name: Check accepted ADRs
        if: github.event_name == 'pull_request'
        env:
          DIM_DOCS_ADR_ERRATUM: ${{ contains(github.event.pull_request.labels.*.name, 'adr-erratum') && '1' || '0' }}
        run: node scripts/adr-check.mjs --base HEAD^1
  verify:
    name: verify (${{ matrix.role }})
    needs: changes
    if: inputs.parallelism != 'probe' && inputs.sample_runner != inputs.load_runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: sample
            label: ${{ inputs.sample_runner }}
          - role: load
            label: ${{ inputs.load_runner }}
    runs-on: [self-hosted, macOS, ARM64, "${{ matrix.label }}"]
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: ""
    steps:
      - name: Identify physical host and checkout
        shell: bash
        run: |
          set -euo pipefail
          uuid=$(ioreg -rd1 -c IOPlatformExpertDevice | awk -F'"' '/IOPlatformUUID/ {print $4}')
          test -n "$uuid"
          printf "Host key: "
          printf "%s:%s" "$GITHUB_SHA" "$uuid" | shasum -a 256 | cut -c1-16
          printf "Workspace key: "
          printf "%s" "$GITHUB_WORKSPACE" | shasum -a 256 | cut -c1-16
          printf "Runner UID: "
          id -u
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build and lint the Rust workspace
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          features=()
          if [[ '${{ needs.changes.outputs.eval }}' == true ]]; then
            features+=(--features xtask/eval-tests)
          fi
          cargo clippy --workspace --all-targets --locked ${features[@]+"${features[@]}"} -- -D warnings
          cargo build --workspace --all-targets --locked ${features[@]+"${features[@]}"} --message-format=json > target/test-artifacts.jsonl
      - name: Check crate boundaries and plugin pages
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.xtask == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ needs.changes.outputs.rust }}' != true ]]; then
            cargo build --locked -p xtask
          fi
          target/debug/xtask check
      - name: Synchronize workspace test start
        shell: bash
        env:
          DIM_TRIAL_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          umask 077
          rendezvous="/tmp/dim-ci-ab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$rendezvous"
          touch "$rendezvous/$DIM_TRIAL_ROLE.ready"
          deadline=$((SECONDS + 900))
          until [[ -f "$rendezvous/sample.ready" && -f "$rendezvous/load.ready" ]]; do
            if (( SECONDS >= deadline )); then
              echo "Companion verify did not reach the workspace test start"
              exit 1
            fi
            sleep 1
          done
          sysctl vm.swapusage
      - name: Run compiled workspace tests
        if: needs.changes.outputs.rust == 'true'
        env:
          DIM_TEST_TIMEOUT_MS: "900000"
          DIM_TRIAL_WORKSPACE_PROGRAMS: ${{ matrix.role == 'sample' && inputs.parallelism || '2' }}
        run: |
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl --workspace --test-threads=3
          cargo test --workspace --doc --locked ${{ needs.changes.outputs.eval == 'true' && '--features xtask/eval-tests' || '' }}
      - name: Verify wall-clock background handoff
        if: needs.changes.outputs.execution == 'true'
        run: node scripts/run-rust-test.mjs target/test-artifacts.jsonl local_execution a_long_foreground_command_moves_to_the_background_after_30_seconds --ignored --exact
      - name: Test development and release scripts
        if: needs.changes.outputs.scripts == 'true'
        run: |
          node --check scripts/check-acp-registry.mjs
          node --test scripts/*.test.mjs
      - name: Verify actual CLI profiles and line-mode flows
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix runtime --ignore-scripts --registry=https://registry.npmjs.org
          # The ignored CLI flows below start the real plugins, so their
          # packages are installed here, before the flows; the job's checkout
          # carries them into the Node binding checks as well.
          npm ci --prefix runtime/plugins/workflow --ignore-scripts --registry=https://registry.npmjs.org
          (cd runtime && npm install --no-save --ignore-scripts --install-links ./plugins/workflow)
          export DIM_TEST_APP_SERVER="$PWD/target/debug/dim-app-server"
          # The TUI cases a tmux scenario replaces are ignored in the test
          # target and run only in the local tmux suite
          # (docs/architecture/tui-e2e.md); the remaining TUI cases still run
          # under the ordinary selection, so this step names the production
          # and line-mode flows it keeps.
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl cli_flow \
            accounts::login_reaches_the_codex_account_of_the_production_daemon \
            acp::acp_stdio_temporary_mcp_calls_tools_and_settles_the_child_on_eof \
            configured_api_key_model_uses_production_tools_and_restores_the_same_session \
            export_writes_the_timeline_without_starting_a_daemon \
            fresh_native_startup_uses_workspace_and_ask_without_policy_file \
            hooks::project_hooks_start_disabled_and_the_user_enables_them \
            mcp::mcp_entries_round_trip_through_the_real_app_server \
            permission::real_daemon_always_allow_saves_an_exact_rule_until_approvals_removes_it \
            permission::real_daemon_exec_presets_decide_process_tools_without_automatic_approval \
            project_mcp_entries_start_disabled_and_the_user_enables_them \
            real_daemon_profile_conflicts_preserve_the_running_daemon_and_endpoint \
            workflow::workflow_commands_write_and_enable_against_the_real_owner \
            --ignored --test-threads=2
      - name: Verify startup recovery in a release-stamped CLI
        if: needs.changes.outputs.rust == 'true'
        env:
          DIM_RELEASE_BUILD: '1'
        run: cargo test --locked -p dimcode --test cli_flow "staged_update::recovery::"
      - name: Verify public Node bindings
        if: needs.changes.outputs.node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # 0.19's TypeScript test tool runs plugins on a real rutis-host; the
          # tests run from the repository root, so name it explicitly.
          export RUTIS_HOST="$PWD/runtime/node_modules/.bin/rutis-host"
          node --test runtime/plugin-sdk.test.mjs runtime/light-ocr-*.test.mjs
          # The workflow plugin tests stay off: no double of a
          # test's can receive the plugin definition they register, because
          # 0.19.3's test tool does not take one (rutis-0.19-upgrade M10). The
          # Node-backed Rust flows below still load it for real, and `tsc`
          # checks it.
          node runtime/node_modules/typescript/bin/tsc -p runtime/plugins/workflow/tsconfig.json
          export DIM_TEST_NODE="$(command -v node)"
          export DIM_TEST_JS_RUNTIME="$PWD/runtime/node_modules/@arcships/rutis-runtime"
          export DIM_TEST_RUTIS_SDK="$PWD/runtime/node_modules/@arcships/rutis/src/index.mjs"
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl transport_flow node_ --ignored --test-threads=2
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl mcp_http_flow node_ --ignored --test-threads=2
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl migration_flow node_ --ignored --test-threads=2
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl hub_flow node_ --ignored --test-threads=2
          if [[ '${{ needs.changes.outputs.eval }}' == true ]]; then
            node scripts/run-rust-test.mjs target/test-artifacts.jsonl xtask node_ --ignored --test-threads=2
          fi
      - name: Verify Python plugins
        if: needs.changes.outputs.node == 'true' && vars.DIM_CI_PYTHON_PLUGINS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The Python of `py:` rows: a relocatable CPython, pinned by hash, so the
          # self-hosted runner needs neither a system Python 3.10+ nor sudo.
          python_build="cpython-3.12.15+20261003-aarch64-apple-darwin-install_only.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20261003/${python_build/+/%2B}"
          echo "316a463172740e71d8dca1f2730784e325f3f720941137b5d674d5801a632213  $RUNNER_TEMP/python.tar.gz" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/python" runtime/.venv
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/python/bin/python3" -m venv runtime/.venv
          runtime/.venv/bin/python -m pip install --require-hashes --no-deps -r runtime/python-requirements.txt
          export PATH="$RUNNER_TEMP/python/bin:$PATH"
          export DIM_TEST_NODE="$(command -v node)"
          export DIM_TEST_JS_RUNTIME="$PWD/runtime/node_modules/@arcships/rutis-runtime"
          export DIM_TEST_PYTHON="$PWD/runtime/.venv/bin/python"
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl transport_flow python_plugin_ --ignored --test-threads=2
      - name: Verify downloaded Node runtime
        if: needs.changes.outputs.node == 'true' && github.event_name != 'pull_request'
        run: node scripts/run-rust-test.mjs target/test-artifacts.jsonl transport_flow runtime_manager::runtime_switches_from_system_to_downloaded_node --ignored --exact
      - name: Release workspace start barrier
        if: always()
        shell: bash
        env:
          DIM_TRIAL_ROLE: ${{ matrix.role }}
        run: |
          rendezvous="/tmp/dim-ci-ab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -f "$rendezvous/$DIM_TRIAL_ROLE.ready"
          if [[ -d "$rendezvous" ]]; then rmdir "$rendezvous" 2>/dev/null || true; fi
          sysctl vm.swapusage
