name: PR check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.run_id) || github.ref }}
  cancel-in-progress: true
env:
  # CI only needs pass/fail; skipping debug info shortens compiling and linking.
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  changes:
    # Pull requests run only the groups their paths need; scripts/ci-changes.mjs holds the rules.
    # Self-hosted runners keep state between jobs, so they run only code from branches of this
    # repository; fork pull requests skip every job and fail ci-ok. See docs/release/README.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.groups.outputs.rust }}
      windows: ${{ steps.groups.outputs.windows }}
      xtask: ${{ steps.groups.outputs.xtask }}
      node: ${{ steps.groups.outputs.node }}
      eval: ${{ steps.groups.outputs.eval }}
      execution: ${{ steps.groups.outputs.execution }}
      web: ${{ steps.groups.outputs.web }}
      scripts: ${{ steps.groups.outputs.scripts }}
      macos_scripts: ${{ steps.groups.outputs.macos_scripts }}
      dependencies: ${{ steps.groups.outputs.dependencies }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The merge commit and its base parent.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select check groups
        id: groups
        env:
          DIM_CI_PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-changes.mjs
      - name: Check accepted ADRs
        if: github.event_name == 'pull_request'
        env:
          DIM_DOCS_ADR_ERRATUM: ${{ contains(github.event.pull_request.labels.*.name, 'adr-erratum') && '1' || '0' }}
        run: node scripts/adr-check.mjs --base HEAD^1
  dependencies:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.dependencies == 'true'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure Windows C/C++ toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64
      - name: Install cargo-deny
        run: cargo install --jobs 2 --locked cargo-deny --version '=0.20.2'
      - name: Check dependency advisories and licenses
        run: cargo deny --locked check advisories licenses
  windows-cli:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure Windows C/C++ toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64
      - name: Verify native Windows CLI boundaries
        run: cargo test --locked -p dim-cli --lib
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build and test the Web workspace
        run: |
          $declarations = 'web/src/auto-imports.d.ts', 'web/src/components.d.ts'
          $original = @{}
          foreach ($file in $declarations) {
            $original[$file] = (Get-Content -Raw -Encoding UTF8 $file).Replace("`r`n", "`n")
          }
          $version = node -p "require('./npm/package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:Path = "$env:WINDIR\System32;$env:Path"
          node scripts/stage-web.mjs staging/release-web $version $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notices = tar.exe -xOzf "staging/release-web/dimcode-web-$version.tar.gz" dimcode-web/web/THIRD-PARTY-NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($package in 'vue', 'vue-router', 'pinia') {
            $entry = $notices -cmatch "^${package}@"
            if (-not $entry) { throw "Missing third-party notice for $package" }
            Write-Output $entry
          }
          foreach ($file in $declarations) {
            if ((Get-Content -Raw -Encoding UTF8 $file).Replace("`r`n", "`n") -cne $original[$file]) {
              throw "Generated declaration changed: $file"
            }
          }
      - name: Test the Web workspace
        run: npm.cmd test --prefix web
      - name: Test the chat-ui package
        run: npm.cmd test --prefix web --workspace=@dimcode/chat-ui
      - name: Typecheck the chat-ui package
        run: npm.cmd run typecheck --prefix web --workspace=@dimcode/chat-ui
      - name: Lint the chat-ui package
        run: npm.cmd run lint --prefix web --workspace=@dimcode/chat-ui
      - name: Check the chat-ui package boundaries
        run: npm.cmd run check:boundary --prefix web --workspace=@dimcode/chat-ui
      - name: Build the chat-ui package
        run: npm.cmd run build --prefix web --workspace=@dimcode/chat-ui
  verify:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || needs.changes.outputs.xtask == 'true' ||
      needs.changes.outputs.scripts == 'true'
    name: verify (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'pull_request' && '["linux"]' || github.event_name == 'push' && '["macos"]' || '["linux","macos"]') }}
    runs-on: ${{ matrix.platform == 'linux' && fromJSON('["self-hosted","linux","x64","dim-verify"]') || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: ${{ matrix.platform == 'linux' && '8' || '4' }}
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b
        if: runner.os == 'Linux'
        with:
          cache: false
          build-warnings: ""
      - name: Report Linux host support
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CPUs: $(nproc)"
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
          # Without a working bubblewrap the confined process tests return without running.
          bwrap --ro-bind / / true
      - name: Build and lint the Rust workspace
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check --config error_on_line_overflow=true
          features=()
          if [[ '${{ needs.changes.outputs.eval }}' == true ]]; then
            features+=(--features xtask/eval-tests)
          fi
          cargo clippy --workspace --all-targets --locked ${features[@]+"${features[@]}"} -- -D warnings
          cargo build --workspace --all-targets --locked ${features[@]+"${features[@]}"} --message-format=json > target/test-artifacts.jsonl
      - name: Check crate boundaries and plugin pages
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.xtask == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ needs.changes.outputs.rust }}' != true ]]; then
            cargo build --locked -p xtask
          fi
          target/debug/xtask check
      - name: Run compiled workspace tests
        if: needs.changes.outputs.rust == 'true'
        env:
          DIM_TEST_TIMEOUT_MS: "900000"
        run: |
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl --workspace --test-threads=3
          cargo test --workspace --doc --locked ${{ needs.changes.outputs.eval == 'true' && '--features xtask/eval-tests' || '' }}
      - name: Verify wall-clock background handoff
        if: needs.changes.outputs.execution == 'true'
        run: node scripts/run-rust-test.mjs target/test-artifacts.jsonl local_execution a_long_foreground_command_moves_to_the_background_after_30_seconds --ignored --exact
      - name: Test development and release scripts
        if: needs.changes.outputs.scripts == 'true'
        run: |
          node --check scripts/check-acp-registry.mjs
          node --test scripts/*.test.mjs
      - name: Verify actual CLI profiles and line-mode flows
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix runtime --ignore-scripts --registry=https://registry.npmjs.org
          # The ignored CLI flows below start the real plugins, so their
          # packages are installed here, before the flows; the job's checkout
          # carries them into the Node binding checks as well.
          npm ci --prefix runtime/plugins/workflow --ignore-scripts --registry=https://registry.npmjs.org
          (cd runtime && npm install --no-save --ignore-scripts --install-links ./plugins/workflow)
          export DIM_TEST_APP_SERVER="$PWD/target/debug/dim-app-server"
          # The TUI cases a tmux scenario replaces are ignored in the test
          # target and run only in the local tmux suite
          # (docs/architecture/tui-e2e.md); the remaining TUI cases still run
          # under the ordinary selection, so this step names the production
          # and line-mode flows it keeps.
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl cli_flow \
            accounts::login_reaches_the_codex_account_of_the_production_daemon \
            acp::acp_stdio_temporary_mcp_calls_tools_and_settles_the_child_on_eof \
            configured_api_key_model_uses_production_tools_and_restores_the_same_session \
            export_writes_the_timeline_without_starting_a_daemon \
            fresh_native_startup_uses_workspace_and_ask_without_policy_file \
            hooks::project_hooks_start_disabled_and_the_user_enables_them \
            mcp::mcp_entries_round_trip_through_the_real_app_server \
            permission::real_daemon_always_allow_saves_an_exact_rule_until_approvals_removes_it \
            permission::real_daemon_exec_presets_decide_process_tools_without_automatic_approval \
            project_mcp_entries_start_disabled_and_the_user_enables_them \
            real_daemon_profile_conflicts_preserve_the_running_daemon_and_endpoint \
            workflow::workflow_commands_write_and_enable_against_the_real_owner \
            --ignored --test-threads=2
      - name: Verify startup recovery and Update now in a release-stamped CLI
        if: needs.changes.outputs.rust == 'true'
        env:
          DIM_RELEASE_BUILD: '1'
        run: |
          cargo test --locked -p dimcode --test cli_flow "staged_update::recovery::"
          cargo test --locked -p dimcode --test cli_flow "staged_update::tui_update::"
      - name: Verify public Node bindings
        if: needs.changes.outputs.node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The TypeScript test tool runs plugins on a real rutis-host; the
          # tests run from the repository root, so name it explicitly.
          export RUTIS_HOST="$PWD/runtime/node_modules/.bin/rutis-host"
          node --test runtime/plugin-sdk.test.mjs runtime/light-ocr-*.test.mjs
          # The workflow plugin has no plugin test that needs a definition
          # double; the Node-backed Rust flows load it for real, and `tsc`
          # checks it.
          node runtime/node_modules/typescript/bin/tsc -p runtime/plugins/workflow/tsconfig.json
          export DIM_TEST_NODE="$(command -v node)"
          export DIM_TEST_JS_RUNTIME="$PWD/runtime/node_modules/@arcships/rutis-runtime"
          export DIM_TEST_RUTIS_SDK="$PWD/runtime/node_modules/@arcships/rutis/src/index.mjs"
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl transport_flow node_ --ignored --test-threads=2
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl mcp_http_flow node_ --ignored --test-threads=2
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl migration_flow node_ --ignored --test-threads=2
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl hub_flow node_ --ignored --test-threads=2
          if [[ '${{ needs.changes.outputs.eval }}' == true ]]; then
            node scripts/run-rust-test.mjs target/test-artifacts.jsonl xtask node_ --ignored --test-threads=2
          fi
      - name: Verify Python plugins
        if: needs.changes.outputs.node == 'true' && vars.DIM_CI_PYTHON_PLUGINS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The Python of `py:` rows: a relocatable CPython, pinned by hash, so the
          # self-hosted runner needs neither a system Python 3.10+ nor sudo.
          if [[ "$RUNNER_OS" == Linux ]]; then
            python_target=x86_64-unknown-linux-gnu
            python_sha256=f937814031eab4698ca6d07ec606ede1825768f3f3e99af76d9db3900bee03c5
          else
            python_target=aarch64-apple-darwin
            python_sha256=316a463172740e71d8dca1f2730784e325f3f720941137b5d674d5801a632213
          fi
          python_build="cpython-3.12.15+20261003-${python_target}-install_only.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20261003/${python_build/+/%2B}"
          echo "$python_sha256  $RUNNER_TEMP/python.tar.gz" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/python" runtime/.venv
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/python/bin/python3" -m venv runtime/.venv
          runtime/.venv/bin/python -m pip install --require-hashes --no-deps -r runtime/python-requirements.txt
          export PATH="$RUNNER_TEMP/python/bin:$PATH"
          export DIM_TEST_NODE="$(command -v node)"
          export DIM_TEST_JS_RUNTIME="$PWD/runtime/node_modules/@arcships/rutis-runtime"
          export DIM_TEST_PYTHON="$PWD/runtime/.venv/bin/python"
          node scripts/run-rust-test.mjs target/test-artifacts.jsonl transport_flow python_plugin_ --ignored --test-threads=2
      - name: Verify downloaded Node runtime
        if: needs.changes.outputs.node == 'true' && github.event_name != 'pull_request'
        run: node scripts/run-rust-test.mjs target/test-artifacts.jsonl transport_flow runtime_manager::runtime_switches_from_system_to_downloaded_node --ignored --exact
  macos-native:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.macos_scripts == 'true')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test macOS native Rust flows
        if: needs.changes.outputs.rust == 'true'
        run: node scripts/test-macos-native.mjs
      - name: Test macOS code layout and release packaging
        if: needs.changes.outputs.macos_scripts == 'true'
        run: |
          node --test scripts/code-layout-darwin.test.mjs
          node --test --test-name-pattern='^native package staging' scripts/release.test.mjs
  acp-registry:
    needs: changes
    if: github.event_name != 'pull_request' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b
        with:
          cache: false
          build-warnings: ""
      - name: Build the account executable
        env:
          DIM_OAUTH_CLIENT_ID_CN: ${{ secrets.DIM_OAUTH_CLIENT_ID_CN }}
          DIM_OAUTH_CLIENT_ID_GLOBAL: ${{ secrets.DIM_OAUTH_CLIENT_ID_GLOBAL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DIM_OAUTH_CLIENT_ID_CN" || -z "$DIM_OAUTH_CLIENT_ID_GLOBAL" ]]; then
            echo 'ACP Registry acceptance requires both OAuth client ID secrets.' >&2
            exit 1
          fi
          cargo build --locked -p dimcode
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: agentclientprotocol/registry
          ref: 49f768659a8089f07874f56a0d474312695ad861
          path: .acp-registry
          persist-credentials: false
      - name: Verify upstream Registry authentication and protocol
        shell: bash
        run: node scripts/check-acp-registry.mjs target/debug/dimcode .acp-registry "$RUNNER_TEMP/acp-registry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acp-registry
          path: ${{ runner.temp }}/acp-registry-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 1
  ci-ok:
    # The one check to require: it passes when every selected job passed and skipped jobs were not needed.
    needs: [changes, dependencies, windows-cli, web, verify, macos-native, acp-registry]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      # A skipped changes job means a fork pull request, which this workflow does not verify.
      - name: Fail unless every selected job passed
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
