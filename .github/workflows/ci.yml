name: PR check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # PR runners must be isolated from release credentials and private networks.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify public source
        shell: bash
        run: |
          set -euo pipefail
          unset RUSTC_WRAPPER
          export CARGO_INCREMENTAL=0
          cargo build --workspace --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo run --locked -p xtask -- check
          node --test scripts/*.test.mjs
      - name: Verify actual CLI profiles and terminal launcher
        shell: bash
        run: |
          set -euo pipefail
          export DIM_TEST_APP_SERVER="$PWD/target/debug/dim-app-server"
          export DIM_TEST_NPM_WRAPPER="$PWD/npm/bin/dimcode.mjs"
          cargo test --locked -p dim-cli --test cli_flow -- --ignored
      - name: Verify public Node provider bridge
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix runtime --ignore-scripts --registry=https://registry.npmjs.org
          export DIM_TEST_NODE="$(command -v node)"
          export DIM_TEST_JS_RUNTIME="$PWD/runtime/node_modules/@arcships/rutis-runtime"
          export DIM_TEST_RUTIS_SDK="$PWD/runtime/node_modules/@arcships/rutis/src/index.mjs"
          cargo test --locked -p dim-app-server --test transport_flow node_managed_provider_recovers_credentials_and_failure_is_local -- --ignored
