name: Publish curl nightly
run-name: Publish curl nightly ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags: ['v*.*.*-nightly.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Unused nightly tag (vX.Y.Z-nightly.N)
        required: true
        type: string
      source:
        description: Optional full SHA of a main ancestor (defaults to the dispatched commit)
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'arcships/dim' && github.run_attempt == '1' && (github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          MANUAL_SOURCE: ${{ inputs.source }}
        run: |
          sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Select main to publish a nightly.' >&2; exit 1; }
            [[ "$sha" == "$GITHUB_SHA" ]] || { echo 'Checkout does not match the dispatched commit.' >&2; exit 1; }
            if [[ -n "$MANUAL_SOURCE" ]]; then
              [[ "$MANUAL_SOURCE" =~ ^[0-9a-f]{40}$ && $(git cat-file -t "$MANUAL_SOURCE") == commit ]] || { echo 'Expected a full source commit SHA.' >&2; exit 1; }
              git merge-base --is-ancestor "$MANUAL_SOURCE" "$sha" || { echo 'Source must be an ancestor of the dispatched main commit.' >&2; exit 1; }
              sha=$MANUAL_SOURCE
            fi
            tag=$MANUAL_TAG
          else
            [[ $(git rev-parse "$GITHUB_REF^{commit}") == "$sha" ]] || { echo 'Checkout does not match the pushed tag.' >&2; exit 1; }
            tag=$GITHUB_REF_NAME
          fi
          n='(0|[1-9][0-9]*)'
          [[ "$tag" =~ ^v$n\.$n\.$n-nightly\.$n$ ]] || { echo 'Expected a nightly tag in the form vX.Y.Z-nightly.N.' >&2; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          printf 'sha=%s\ntag=%s\n' "$sha" "$tag" >> "$GITHUB_OUTPUT"
      - name: Reserve the manually requested tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.source.outputs.tag }}
          SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$NIGHTLY_TAG" -f "sha=$SOURCE" >/dev/null
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Stamp the build checkout and collect Rust notices
        shell: bash
        env:
          NIGHTLY_TAG: ${{ steps.source.outputs.tag }}
        run: |
          node --input-type=module -e "import {stampBuildVersion} from './scripts/alpha-version.mjs'; stampBuildVersion(process.env.NIGHTLY_TAG.slice(1))"
          archive=cargo-about-0.9.3-x86_64-unknown-linux-musl
          curl -fsSL "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/$archive.tar.gz" -o "$RUNNER_TEMP/about.tar.gz"
          echo "3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4  $RUNNER_TEMP/about.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/about.tar.gz" -C "$RUNNER_TEMP" "$archive/cargo-about"
          cargo fetch --locked
          PATH="$RUNNER_TEMP/$archive:$PATH" node scripts/rust-notices.mjs rust-notices.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-inputs
          path: |
            Cargo.toml
            Cargo.lock
            npm/package.json
            runtime/package.json
            runtime/package-lock.json
            rust-notices.txt
          retention-days: 1
          if-no-files-found: error
  build:
    needs: prepare
    if: github.run_attempt == '1'
    environment: release-build
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:54b271d9562a3686298880df05367909e949ed317e7b1b79b59c696d75f78676
          - platform: linux-x64
            runner: ubuntu-22.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-inputs
          digest-mismatch: error
      - name: Build native CLI
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIM_RELEASE_BUILD: '1'
          DIM_BUILD_ID: ${{ github.run_id }}-${{ matrix.platform }}
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_BUILD_JOBS: '2'
          DIM_OAUTH_CLIENT_ID_CN: ${{ secrets.DIM_OAUTH_CLIENT_ID_CN }}
          DIM_OAUTH_CLIENT_ID_GLOBAL: ${{ secrets.DIM_OAUTH_CLIENT_ID_GLOBAL }}
        run: |
          : "${DIM_OAUTH_CLIENT_ID_CN:?}" "${DIM_OAUTH_CLIENT_ID_GLOBAL:?}"
          if [[ -n "$IMAGE" ]]; then
            docker run --rm --user "$(id -u):$(id -g)" --workdir /src --entrypoint /bin/bash \
              -v "$PWD:/src" -v "$(rustc --print sysroot):/opt/rust:ro" -e HOME=/tmp \
              -e DIM_RELEASE_BUILD -e DIM_BUILD_ID -e CARGO_PROFILE_RELEASE_LTO -e CARGO_BUILD_JOBS \
              -e DIM_OAUTH_CLIENT_ID_CN -e DIM_OAUTH_CLIENT_ID_GLOBAL "$IMAGE" -ec \
              'export PATH="/opt/rust/bin:$PATH"; cargo build --locked --release -p dimcode; target/release/dimcode --version'
          else
            cargo build --locked --release -p dimcode
          fi
      - name: Package and check installed version
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          SOURCE: ${{ needs.prepare.outputs.sha }}
          NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          [[ $(node -p 'process.platform + "-" + process.arch') == "$PLATFORM" ]]
          version=${NIGHTLY_TAG#v}
          node scripts/stage-plugins.mjs staging/plugins
          node scripts/stage-release.mjs target/release staging/package "$version" "$SOURCE" --account --plugins staging/plugins --rust-notices rust-notices.txt
          archive="dimcode-$PLATFORM-$version.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C staging/package .
          mkdir staging/check
          tar -xzf "$archive" -C staging/check
          [[ $(staging/check/bin/dimcode --version) == "dimcode $version" ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.platform }}
          path: dimcode-*.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    if: github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-curl-nightly
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
          digest-mismatch: error
      - run: node scripts/publish-nightly.mjs archives "$NIGHTLY_TAG" "$SOURCE"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.prepare.outputs.sha }}
          NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
