name: issue-gate

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

jobs:
  issue-gate:
    name: issue-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # Trusted definition: pull_request_target runs this file from the base branch.
      # Checkout the base branch only; never check out or run pull request code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Evaluate linked issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/issue-gate.mjs
