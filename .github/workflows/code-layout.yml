name: Linux code layout

on:
  pull_request:
    paths:
      - scripts/code-layout/**
      - scripts/code-layout.test.mjs
      - .github/workflows/code-layout.yml
      - rust-toolchain.toml
      - .node-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-artifact:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: rustup show
      - run: node --test scripts/code-layout.test.mjs
