name: Assemble the OCR bundle
# Builds the downloadable OCR component (docs/design/plugins/RuntimeManager.md
# §2.5): PP-OCRv6 small models, ONNX Runtime and pdfium for each platform,
# packed reproducibly from the pins in runtime/ocr-bundle.json. A dispatch
# checks the built digests against the pin in runtime/runtimes.json, which is
# the reproducibility gate; publishing uploads the same assets to the
# ocr-bundle-v1 release, and `runtime.install ocr` downloads nothing until that
# has happened.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the built archives to the ocr-bundle-v1 release
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ocr-bundle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pack:
    name: Pack every platform
    # Packing needs no target machine: nothing is signed here, and every
    # upstream library is copied byte for byte.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build and check against the pin
        shell: bash
        run: |
          set -euo pipefail
          # The Node release the repository pins builds every archive, never
          # whatever a runner happens to ship.
          node scripts/ocr-bundle.mjs --platform all --cache "$RUNNER_TEMP/ocr-bundle-cache" --out dist/ocr-bundle --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.publish
        with:
          name: ocr-bundle
          path: dist/ocr-bundle/*
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish ocr-bundle-v1
    needs: pack
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ocr-bundle-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require the dispatch to run from main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Publishing tags main; dispatch from main.' >&2; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-bundle
          path: dist/ocr-bundle
      - name: Verify the built archives against the pin
        run: node scripts/ocr-bundle.mjs --verify dist/ocr-bundle
      - name: Upload the archives to the release
        run: |
          set -euo pipefail
          cat > dist/notes.md <<'NOTES'
          The OCR component bundle: the PP-OCRv6 small detection and recognition
          models, their dictionary, ONNX Runtime 1.31.1 and pdfium 8125, for the
          five supported platforms. Built by .github/workflows/ocr-bundle.yml;
          runtime/runtimes.json pins every archive.
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/ocr-bundle/* --clobber
          else
            gh release create "$TAG" dist/ocr-bundle/* --notes-file dist/notes.md \
              --title "OCR component bundle v1" --target "$GITHUB_SHA"
          fi
      - name: Verify the release's assets against the pin
        run: |
          set -euo pipefail
          rm -rf dist/published && mkdir -p dist/published
          gh release download "$TAG" --dir dist/published --pattern '*.tar.gz' --pattern '*.zip'
          node scripts/ocr-bundle.mjs --verify dist/published
