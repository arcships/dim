[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
[features]
eval-tests = []
[dependencies]
rusqlite = { version = "0.41.1", features = ["backup"] }
dim-agent-runtime = { workspace = true, features = ["testing"] }
dim-agent-capabilities.workspace = true
dim-agent-aimux.workspace = true
dim-agent-attachments.workspace = true
dim-agent-questions.workspace = true
dim-app-server.workspace = true
dim-session-title.workspace = true
dim-agent-scheduler = { path = "../crates/dim-agent-scheduler" }
dim-goal.workspace = true
dim-report.workspace = true
dim-event-hub.workspace = true
dim-modality.workspace = true
dim-agent-types.workspace = true
dim-client.workspace = true
rutis.workspace = true
rutis-bridge.workspace = true
rutis-types = "0.19.3"
rutis-loader.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
syn = { version = "2", features = ["full", "visit"] }
axum = { workspace = true, features = ["json"] }
# The run child's process group: a cancelled run kills the group, so the
# Node plugin runtimes it started go with it. std starts the group
# (`process_group(0)`); signalling it needs the syscall, and no workspace
# crate re-exports a group kill.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
[dev-dependencies]
