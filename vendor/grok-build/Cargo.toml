# Vendored from xai-org/grok-build; see SOURCE.md. This is its own workspace
# (excluded from `rust/Cargo.toml`) so the upstream crate manifests keep their
# `workspace = true` inheritance and stay diffable against upstream.
[workspace]
members = [
    "xai-grok-markdown",
    "xai-grok-markdown-core",
    "xai-ratatui-inline",
    "xai-ratatui-textarea",
]
resolver = "2"

[workspace.package]
edition = "2024"

# Versions mirror grok-build's root Cargo.toml at SOURCE_REV, restricted to the
# dependencies these four crates use.
[workspace.dependencies]
xai-grok-markdown = { path = "xai-grok-markdown" }
xai-grok-markdown-core = { path = "xai-grok-markdown-core" }
xai-ratatui-inline = { path = "xai-ratatui-inline" }
xai-ratatui-textarea = { path = "xai-ratatui-textarea" }
anstyle = "1.0"
anstyle-lossy = "1.1.4"
anstyle-parse = "0.2"
anstyle-syntect = "1.0.4"
html-escape = "0.2"
linkify = "0.10"
pulldown-cmark = "0.13"
ratatui = { version = "0.29" }
ratatui-core = "0.1"
strum = { version = "0.27", features = ["derive"] }
supports-color = "3.0"
syntect = { version = "5.3", default-features = false, features = ["default-onig"] }
textwrap = "0.16"
tracing = "0.1"
tui-scrollbar = "0.2"
two-face = { version = "0.4", default-features = false, features = ["syntect-onig"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
url = "2"
crossterm = "0.28"
# dev-only
ansi-width = "0.1"
anyhow = { version = "1", features = ["backtrace"] }
arboard = "3.6"
colored_json = "5"
criterion = "0.6"
fuzzy-matcher = "0.3.7"
ignore = "0.4"
itertools = "0.14"
lipsum = "0.9"
pretty_assertions = "1"
rand = "0.9"
serde_json = "1"
termwiz = { version = "0.23", default-features = false }

[workspace.lints.clippy]
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
needless_lifetimes = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
useless_format = "allow"
