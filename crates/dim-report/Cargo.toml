[package]
name = "dim-report"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared error reports for Dim clients"

[dependencies]
dim-agent-capabilities.workspace = true
dim-agent-runtime.workspace = true
dim-agent-types.workspace = true
dim-app-server.workspace = true
rutis.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid = { workspace = true, features = ["serde"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
url = "2"
zip = { version = "9.1", default-features = false }

[dev-dependencies]
dim-client.workspace = true
dim-agent-runtime = { workspace = true, features = ["testing"] }
tempfile = "3"
futures-util.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite.workspace = true
