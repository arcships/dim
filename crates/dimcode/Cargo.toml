[package]
name = "dimcode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The single dimcode executable: the CLI, with the App Server as its `app-server` subcommand"
autotests = false

[[bin]]
name = "dimcode"
path = "src/main.rs"

[[test]]
name = "cli_flow"
path = "tests/cli_flow.rs"

[[test]]
name = "cli_tui_flow"
path = "tests/cli_tui_flow.rs"

[[test]]
name = "cli_session_flow"
path = "tests/cli_session_flow.rs"

[[test]]
name = "cli_daemon_flow"
path = "tests/cli_daemon_flow.rs"

[[test]]
name = "ocr_helper_flow"
path = "tests/ocr_helper_flow.rs"

[[test]]
name = "ui_leaf"
path = "tests/ui_leaf.rs"

[features]
# Compile the Web workspace into the executable (dim-app-server's feature).
embedded-web = ["dim-app-server/embedded-web"]

[dependencies]
dim-cli = { path = "../dim-cli" }
dim-app-server.workspace = true
dim-session-title.workspace = true
dim-goal.workspace = true
dim-report.workspace = true
dim-modality.workspace = true
dim-image-understanding.workspace = true
dim-ocr.workspace = true
dim-modality-aimux.workspace = true
dim-oauth = { path = "../dim-oauth" }
dim-agent-scheduler = { path = "../dim-agent-scheduler" }
dim-event-hub = { path = "../dim-event-hub" }
dim-agent-runtime.workspace = true
dim-agent-capabilities.workspace = true

[dev-dependencies]
agent-client-protocol-schema = { version = "=1.12.0", default-features = false }
base64 = "0.22.1"
sha2 = "0.10.9"
dim-client.workspace = true
dim-agent-types.workspace = true
# The legacy prompt-reference flow seeds a real branch through a Session, which
# needs the runtime's test host.
dim-agent-runtime = { workspace = true, features = ["testing"] }
dim-agent-capabilities = { workspace = true, features = ["testing"] }
futures-util.workspace = true
http = "1"
url = "2"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde_json.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
libc = "0.2"
rutis.workspace = true
rutis-bridge.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rusqlite = "0.41.1"

[lints]
workspace = true
