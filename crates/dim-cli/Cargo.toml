[package]
name = "dim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dimcode"
path = "src/main.rs"

[dependencies]
dim-agent-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
uuid.workspace = true
sha2 = "0.10.9"
anstyle = "1.0"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false }
unicode-segmentation = "1.12"
unicode-width = "0.2"
xai-grok-markdown = { path = "../../vendor/grok-build/xai-grok-markdown" }
xai-ratatui-inline = { path = "../../vendor/grok-build/xai-ratatui-inline" }
xai-ratatui-textarea = { path = "../../vendor/grok-build/xai-ratatui-textarea" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
