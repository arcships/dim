[package]
name = "dim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dim-client.workspace = true
dim-migration.workspace = true
dim-acp.workspace = true
dim-agent-types.workspace = true
dim-agent-capabilities.workspace = true
tokio-util.workspace = true
rutis.workspace = true
rutis-bridge.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
uuid.workspace = true
sha2 = "0.10.9"
anstyle = "1.0"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false }
unicode-segmentation = "1.12"
unicode-width = "0.2"
xai-grok-markdown = { path = "../../vendor/grok-build/xai-grok-markdown" }
xai-ratatui-inline = { path = "../../vendor/grok-build/xai-ratatui-inline" }
xai-ratatui-textarea = { path = "../../vendor/grok-build/xai-ratatui-textarea" }
ignore = "0.4.25"
url = "2"
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
flate2 = "1.1"
tar = { version = "0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["tiff"] }
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSEnumerator", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Memory", "Win32_UI_Shell"] }

[target.'cfg(windows)'.dev-dependencies]
portable-pty = "0.9.0"
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
