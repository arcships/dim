[package]
name = "dim-goal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The operator's standing goal for a branch, as a rutis plugin"
autotests = false

[[test]]
name = "goal_suite"
path = "tests/goal_suite.rs"

[features]
# Hooks that race flow tests use to hold a continuation write open.
testing = []

[dependencies]
dim-agent-capabilities.workspace = true
dim-agent-runtime.workspace = true
dim-agent-types.workspace = true
dim-app-server.workspace = true
rutis.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
dim-agent-aimux.workspace = true
# The flow tests drive Goal through the `testing` module; a self
# dev-dependency enables the feature for them.
dim-goal = { path = ".", features = ["testing"] }
dim-agent-runtime = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
dim-app-server = { workspace = true, features = ["testing"] }
dim-client.workspace = true
futures-util.workspace = true
tracing-subscriber.workspace = true
rutis-loader.workspace = true

[lints]
workspace = true
