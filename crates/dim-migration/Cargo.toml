[package]
name = "dim-migration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "On-demand legacy CLI and Desktop data migration plugin"

[dependencies]
dim-agent-types.workspace = true
dim-agent-capabilities.workspace = true
dim-agent-runtime.workspace = true
dim-app-server.workspace = true
rutis.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rusqlite = "0.41.1"
sha2 = "0.10.9"
base64 = "0.23.1"
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_jcs = "0.2"
crossterm = "0.28"
unicode-width = "0.2"

[dev-dependencies]
dim-agent-runtime = { workspace = true, features = ["testing"] }
dim-oauth = { path = "../dim-oauth" }
dim-agent-scheduler = { path = "../dim-agent-scheduler" }
tempfile = "3"
dim-app-server = { workspace = true, features = ["testing"] }
dim-client.workspace = true
