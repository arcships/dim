[package]
name = "dim-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dim-agent-runtime.workspace = true
dim-agent-types.workspace = true
dim-agent-capabilities.workspace = true
dim-agent-aimux.workspace = true
dim-agent-attachments.workspace = true
dim-agent-questions.workspace = true
rutis.workspace = true
rutis-loader.workspace = true
rutis-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
futures-util.workspace = true
axum.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "hooks"] }
sha2 = "0.10.9"
foldhash = "0.2"
getrandom = "0.3"
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
# The Windows Node archives are zip files (runtime manager).
zip = { version = "9.1", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
base64 = "0.22"
serde_jcs = "0.2"
jsonschema = { version = "0.50.1", default-features = false }
regex = "1"
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "transport-async-rw", "auth"] }
async-trait = "0.1"
bytes = "1"
encoding_rs = "0.8"
html-escape = "0.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest-mcp = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
tokio-rustls = "0.26"
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[features]
# Hooks that race flow tests use to hold an operation open.
testing = []
# Build `web/` with npm and compile it into the binary (web-workspace.md §2.4);
# off, the Web workspace is the separate dimcode-web artifact.
embedded-web = []

[dev-dependencies]
dim-app-server = { path = ".", features = ["testing"] }
dim-agent-runtime = { workspace = true, features = ["testing"] }
dim-agent-capabilities = { workspace = true, features = ["testing"] }
axum = { workspace = true, features = ["json"] }
# The Timeline export flow copies a live store with the backup API.
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tokio-tungstenite.workspace = true

[build-dependencies]
flate2 = "1.1"

