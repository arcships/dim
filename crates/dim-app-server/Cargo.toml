[package]
name = "dim-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dim-agent-runtime.workspace = true
dim-agent-types.workspace = true
dim-agent-capabilities.workspace = true
dim-agent-aimux.workspace = true
rutis.workspace = true
rutis-loader.workspace = true
rutis-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
futures-util.workspace = true
axum.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
base64 = "0.22"
serde_jcs = "0.2"
regex = "1"
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "transport-async-rw"] }
reqwest-mcp = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
dim-agent-runtime = { workspace = true, features = ["testing"] }
axum = { workspace = true, features = ["json"] }
tokio-tungstenite.workspace = true
