[workspace]
resolver = "2"
members = ["crates/dim-agent-types", "crates/dim-agent-runtime", "crates/dim-agent-capabilities", "crates/dim-agent-aimux", "crates/dim-agent-attachments", "crates/dim-agent-questions", "crates/dim-agent-scheduler", "crates/dim-event-hub", "crates/dim-app-server", "crates/dim-client", "crates/dim-acp", "crates/dim-cli", "crates/dim-oauth", "crates/dim-session-title", "crates/dim-goal", "crates/dim-report", "crates/dim-codemode", "crates/dim-modality", "crates/dim-image-understanding", "crates/dim-ocr", "crates/dim-modality-aimux", "crates/dimcode", "crates/dim-migration", "xtask", "tests/extension-a", "tests/extension-b", "tests/integration"]
exclude = ["vendor/grok-build"]

[workspace.package]
version = "0.1.0-alpha.27"
edition = "2024"
license = "MIT"
rust-version = "1.100"
repository = "https://github.com/arcships/dim"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"

[workspace.dependencies]
rutis = "0.23.0"
rutis-loader = { version = "0.23.0", features = ["node"] }
rutis-bridge = "0.23.0"
schemars = "1"
dim-agent-types = { path = "crates/dim-agent-types" }
dim-agent-runtime = { path = "crates/dim-agent-runtime" }
dim-agent-capabilities = { path = "crates/dim-agent-capabilities" }
dim-agent-aimux = { path = "crates/dim-agent-aimux" }
dim-agent-attachments = { path = "crates/dim-agent-attachments" }
dim-agent-questions = { path = "crates/dim-agent-questions" }
aimux-core = { version = "=0.6.1" }
aimux-provider-utils = { version = "=0.6.1", features = ["ws"] }
aimux-providers = { version = "=0.6.1", default-features = false }
dim-app-server = { path = "crates/dim-app-server" }
dim-session-title = { path = "crates/dim-session-title" }
dim-event-hub = { path = "crates/dim-event-hub" }
dim-goal = { path = "crates/dim-goal" }
dim-report = { path = "crates/dim-report" }
dim-codemode = { path = "crates/dim-codemode" }
dim-modality = { path = "crates/dim-modality" }
dim-image-understanding = { path = "crates/dim-image-understanding" }
dim-ocr = { path = "crates/dim-ocr" }
dim-modality-aimux = { path = "crates/dim-modality-aimux" }
dim-client = { path = "crates/dim-client" }
dim-migration = { path = "crates/dim-migration" }
dim-acp = { path = "crates/dim-acp" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "time", "net", "process", "io-util", "signal", "fs"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0.20"
futures-util = { version = "0.3", features = ["sink"] }
uuid = { version = "1", features = ["v4"] }
rquickjs = { version = "0.14", features = ["futures", "parallel"] }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The bundled tzdb keeps IANA zones available without host tzdata, as chrono-tz did (#1766).
jiff = { version = "0.2.46", features = ["serde", "tzdb-bundle-always"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
